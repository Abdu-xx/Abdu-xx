<style>
  * {

  body {
    background: #000000;

    display: flex;

  /* CRT effect */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(0deg, rgba(0,255,0,0.04) 0px, rgba(0,255,0,0.04) 2px, transparent 2px, transparent 4px);
    pointer-events: none;
    z-index: 10;
  }

  .terminal {
    max-width: 800px;
    width: 100%;
    background: #0a0c0a;
    border: 2px solid #ff2222;
    border-radius: 10px;
    box-shadow: 0 0 25px rgba(255,0,0,0.4), inset 0 0 15px rgba(255,0,0,0.1);
    overflow: hidden;
  }

  .header {
    background: #150505;
    padding: 14px 18px;
    border-bottom: 1px solid #ff3333;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .red-led {
    width: 12px;
    height: 12px;
    background: #ff0000;
    border-radius: 50%;
    box-shadow: 0 0 10px red;
    animation: pulseRed 0.9s infinite;
  }

  @keyframes pulseRed {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .header h2 {
    color: #ff4a4a;
    font-size: 1rem;
    letter-spacing: 2px;
  }

  .header .protocol {
    margin-left: auto;
    background: #1f0808;
    color: #ff7777;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    border: 1px solid #ff4444;
  }

  .log-container {
    padding: 22px;
    min-height: 420px;
    max-height: 500px;
    overflow-y: auto;
    background: #020502;
  }

  .log-entry {
    margin-bottom: 14px;
    animation: slideIn 0.2s ease-out;
    border-left: 2px solid #ff3333;
    padding-left: 14px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px);}
    to { opacity: 1; transform: translateX(0);}
  }

  .time {
    color: #558855;
    font-size: 0.7rem;
    margin-bottom: 3px;
  }

  .text-danger { color: #ff5555; }
  .text-warning { color: #ffaa55; }
  .text-info { color: #55ffaa; }
  .text-cyan { color: #55ddff; }
  .text-white { color: #cccccc; }

  .progress-container {
    height: 5px;
    background: #1a1a1a;
    border-radius: 4px;
    margin: 10px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff3333, #ff7777);
    border-radius: 4px;
    transition: width 0.05s linear;
  }

  .glitch-text {
    animation: glitchEffect 0.2s infinite;
  }
  @keyframes glitchEffect {
    0% { text-shadow: -1px 0 red; }
    50% { text-shadow: 1px 0 #ff0000; }
    100% { text-shadow: -1px 0 #ff4444; }
  }

  .command-bar {
    padding: 16px;
    border-top: 1px solid #2a1010;
    background: #080202;
    display: flex;
    gap: 10px;
  }

  .command-bar input {
    flex: 1;
    background: #050805;
    border: 1px solid #ff4444;
    padding: 12px 16px;
    color: #ffaaaa;
    font-family: monospace;
    outline: none;
    border-radius: 6px;
  }

  .command-bar button {
    background: #3a1010;
    border: none;
    padding: 12px 24px;
    color: #ffaaaa;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s;
  }
  .command-bar button:hover {
    background: #6e2020;
    color: white;
  }

  .footer {
    background: #0a0303;
    padding: 8px 16px;
    font-size: 0.7rem;
    display: flex;
    justify-content: space-between;
    color: #aa5555;
    border-top: 1px solid #2a1010;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #0a0f0a; }
  ::-webkit-scrollbar-thumb { background: #ff4444; border-radius: 5px; }
</style>
</head>
<body>

<div class="terminal">

<script>
  const logArea = document.getElementById('logArea');
  const cmdInput = document.getElementById('cmdInput');
  const statusMsg = document.getElementById('statusMsg');
  let isBusy = false;

  function addLog(text, colorClass = "text-white", isGlitch = false) {
    const div = document.createElement('div');
    div.className = 'log-entry';
    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    div.innerHTML = `
      <div class="time">[${timeStr}]</div>
      <div class="${colorClass} ${isGlitch ? 'glitch-text' : ''}">${text}</div>
    `;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
  }

  function addProgress(duration = 1400) {
    return new Promise((resolve) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'progress-container';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      wrapper.appendChild(fill);
      logArea.appendChild(wrapper);
      logArea.scrollTop = logArea.scrollHeight;
      
      let width = 0;
      const interval = setInterval(() => {
        width += Math.random() * 18 + 4;
        if (width >= 100) {
          width = 100;
          clearInterval(interval);
          fill.style.width = '100%';
          setTimeout(() => {
            wrapper.remove();
            resolve();
          }, 100);
        }
        fill.style.width = width + '%';
      }, 70);
    });
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function executeOperation(cmd) {
    if (isBusy) {
      addLog("⚠️ SYSTEM BUSY. WAIT.", "text-warning");
      return;
    }
    isBusy = true;
    statusMsg.innerHTML = "🔥 EXECUTING...";

    if (cmd === "leak" || cmd === "leakall") {
      addLog("🎯 ACCESSING TARGET DEVICE...", "text-cyan");
      await sleep(600);
      addLog("📱 SCANNING GALLERY DATABASE...", "text-warning");
      await addProgress(1200);
      addLog("📸 LOCATED 847 MEDIA FILES", "text-info");
      await sleep(400);
      addLog("🔓 DECRYPTING ENCRYPTED STORAGE...", "text-cyan");
      await addProgress(1100);
      addLog("⚠️ INITIATING LEAK SEQUENCE ⚠️", "text-danger", true);
      await sleep(300);

        await sleep(180);
      }
      for (let i = 0; i < 4; i++) {
        addLog(`   ➤ VID_${Math.floor(Math.random()*5000)+1000}.mp4 → EXPOSED`, "text-danger");
        await sleep(200);
      }
      addLog("💀 ALL MEDIA FILES COMPROMISED", "text-danger", true);
      addLog("📡 DATA UPLOADED TO REMOTE SERVER", "text-danger");
    }
    else if (cmd === "destroy" || cmd === "wipe") {
      addLog("💣 ACTIVATING DESTRUCTION MODULE 💣", "text-danger", true);
      await sleep(700);
      addLog("🗑️ LOCATING TARGET FILES...", "text-warning");
      await addProgress(1000);
      addLog("❌ PERMANENT DELETION INITIATED", "text-danger");
      await addProgress(1200);
      addLog("🗑️ 847 FILES REMOVED PERMANENTLY", "text-danger");
      await sleep(400);
      addLog("📱 CORRUPTING FILE INDEX...", "text-cyan");
      await addProgress(900);
      addLog("⚠️ STORAGE STRUCTURE DESTROYED ⚠️", "text-danger", true);
      addLog("💀 DATA UNRECOVERABLE", "text-danger");
    }
    else if (cmd === "hack") {
      addLog("🎯 INITIATING FULL SYSTEM BREACH...", "text-cyan");
      await sleep(500);
      addLog("🔑 CRACKING ACCESS TOKENS...", "text-warning");
      await addProgress(1100);
      addLog("⚠️ ADMIN ROOT ACCESS OBTAINED", "text-danger", true);
      await sleep(400);
      addLog("📡 INSTALLING PERSISTENT BACKDOOR", "text-cyan");
      await addProgress(1000);
      addLog("💀 TARGET SYSTEM COMPROMISED", "text-danger");
    }
    else if (cmd === "crash") {
      addLog("💥 DEPLOYING CRASH VECTOR 💥", "text-danger", true);
      await sleep(600);
      addLog("🔨 CORRUPTING SYSTEM FILES...", "text-warning");
      await addProgress(1300);
      addLog("⚠️ KERNEL PANIC TRIGGERED", "text-danger", true);
      await sleep(500);
      addLog("💀 DEVICE UNRESPONSIVE", "text-danger");
    }
    else if (cmd === "expose") {
      addLog("📸 ACCESSING CAMERA DATABASE...", "text-cyan");
      await sleep(600);
      addLog("🔓 BYPASSING PRIVACY LOCK...", "text-warning");
      await addProgress(1200);
      addLog("⚠️ PHOTOS + VIDEOS COMPROMISED", "text-danger", true);
      for (let i = 0; i < 6; i++) {
        addLog(`   ➤ FILE_${Math.floor(Math.random()*9999)} → CAPTURED`, "text-danger");
        await sleep(150);
      }
      addLog("📤 TRANSMITTING TO EXTERNAL SERVER", "text-danger");
    }
    else if (cmd === "help") {
      addLog("━━━━━━ AVAILABLE COMMANDS ━━━━━━", "text-info");
      addLog("leak     - Extract & expose media files", "text-cyan");
      addLog("destroy  - Permanently delete all data", "text-cyan");
      addLog("hack     - Full system breach", "text-cyan");
      addLog("crash    - Crash target device", "text-cyan");
      addLog("expose   - Expose photos/videos", "text-cyan");
      addLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "text-info");
    }
    else {
      addLog(`❌ ERROR: Unknown command '${cmd}'`, "text-warning");
      addLog("Type 'help' for available commands", "text-cyan");
    }

    statusMsg.innerHTML = "⚡ READY";
    isBusy = false;
  }

  function runCommand() {
    let cmd = cmdInput.value.trim().toLowerCase();
    if (!cmd) return;
    addLog(`> ${cmd}`, "text-cyan");
    cmdInput.value = "";
    executeOperation(cmd);
  }

  document.getElementById('execBtn').addEventListener('click', runCommand);
  cmdInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') runCommand();
  });

  cmdInput.focus();
</script>
